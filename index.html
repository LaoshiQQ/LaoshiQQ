<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#46bfa9" />
  <title>心情收集罐</title>
  <style>
    :root{--bg:#f7fbfb;--ink:#20333b;--muted:#6b7d84;--line:#dcebea;--mint:#46bfa9;--coral:#f4777b;--gold:#ffc84f;--sky:#73aef4;--lilac:#9a77e8;--leaf:#74b84a;--shadow:0 18px 50px rgba(35,94,92,.13);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(circle at 50% 16%,rgba(115,174,244,.2),transparent 28%),linear-gradient(135deg,#f7fbfb,#eef9fb 55%,#fff8eb);min-height:100vh}.app{max-width:1220px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px}.brand{display:flex;gap:12px;align-items:center}.mini-jar{width:42px;height:54px;border:3px solid #287d78;border-radius:12px 12px 16px 16px;background:rgba(255,255,255,.7);position:relative}.mini-jar:before{content:"";position:absolute;left:8px;right:8px;top:-10px;height:12px;border:3px solid #287d78;border-bottom:0;border-radius:8px 8px 0 0}.dot{position:absolute;border-radius:50%;width:11px;height:11px;bottom:10px}.d1{left:8px;background:var(--coral)}.d2{left:20px;background:var(--gold)}.d3{right:6px;background:var(--sky)}h1,h2,p{margin:0}h1{font-size:28px}p{color:var(--muted)}.today{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 16px;box-shadow:var(--shadow);font-weight:800}.grid{display:grid;grid-template-columns:1fr minmax(300px,430px) 1.05fr;gap:16px}.panel{background:rgba(255,255,255,.82);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow)}.moods{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}.mood{border:0;border-radius:18px;padding:14px;background:#fff;box-shadow:0 10px 22px rgba(32,51,59,.08);cursor:grab;text-align:left;min-height:106px;transition:.2s}.mood:hover{transform:translateY(-2px)}.mood b{display:block;font-size:19px;margin-top:6px}.face{font-size:36px}.jar-zone{min-height:610px;display:grid;place-items:center;position:relative;overflow:hidden}.hint{position:absolute;top:20px;text-align:center;font-weight:900;color:#287d78}.jar{width:260px;height:360px;border:10px solid rgba(39,125,120,.82);border-radius:60px 60px 80px 80px;background:linear-gradient(145deg,rgba(255,255,255,.86),rgba(190,239,231,.5));position:relative;box-shadow:inset 0 0 35px rgba(115,174,244,.2),0 25px 60px rgba(35,94,92,.16)}.jar:before{content:"";position:absolute;left:70px;right:70px;top:-62px;height:62px;border:10px solid rgba(39,125,120,.82);border-bottom:0;border-radius:24px 24px 0 0;background:rgba(255,255,255,.75)}.jar:after{content:"";position:absolute;left:62px;right:62px;top:-80px;height:24px;background:#f6c766;border:8px solid #287d78;border-radius:18px}.shine{position:absolute;left:38px;top:55px;width:24px;height:180px;background:rgba(255,255,255,.65);border-radius:999px}.token{position:absolute;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:22px;color:#fff;font-weight:900;box-shadow:0 8px 15px rgba(0,0,0,.12);animation:drop .55s ease both}.jar-zone.ready{outline:3px dashed var(--mint);outline-offset:-18px}.comfort{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;align-items:end;gap:12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);max-width:320px}.animal{width:74px;height:70px;background:#fff2df;border:3px solid #925f4a;border-radius:45% 45% 42% 42%;position:relative;animation:breathe 2.2s ease-in-out infinite}.animal:before,.animal:after{content:"";position:absolute;top:-22px;width:24px;height:36px;background:#fff2df;border:3px solid #925f4a;border-radius:50%}.animal:before{left:10px;transform:rotate(-20deg)}.animal:after{right:10px;transform:rotate(20deg)}.eyes{position:absolute;left:18px;right:18px;top:30px;display:flex;justify-content:space-between}.eyes i{width:7px;height:10px;background:#3d2d2a;border-radius:50%}.mouth{position:absolute;left:32px;top:45px;width:12px;height:7px;border-bottom:3px solid #3d2d2a;border-radius:50%}.animal.hug{animation:hug .7s ease 2}.actions{display:flex;gap:10px;margin-top:12px}.btn,.tab,.month button{border:0;background:#e9f8f5;color:#24796d;font-weight:900;border-radius:12px;padding:10px 12px;cursor:pointer}.btn.primary{background:var(--mint);color:white}.calendar-head,.month{display:flex;align-items:center;justify-content:space-between;gap:12px}.week,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.week{margin-top:16px;color:var(--muted);font-weight:800;text-align:center}.day{aspect-ratio:1;border:1px solid var(--line);border-radius:12px;background:#fff;display:grid;place-items:center;position:relative;font-weight:800}.day.muted{opacity:.35}.day .mark{position:absolute;bottom:5px;width:8px;height:8px;border-radius:50%}.tabs{display:flex;gap:8px;margin:14px 0}.tab.active{background:var(--mint);color:white}.report-row{display:flex;align-items:center;gap:10px;margin:10px 0}.bar{height:10px;background:#edf4f2;border-radius:99px;flex:1;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:#20333b;color:white;padding:12px 16px;border-radius:999px;transition:.25s}.toast.show{opacity:1;transform:translateX(-50%)}@keyframes drop{from{transform:translateY(-220px) scale(.7);opacity:.2}to{transform:translateY(0) scale(1);opacity:1}}@keyframes breathe{50%{transform:translateY(-3px)}}@keyframes hug{50%{transform:scale(1.12) rotate(-3deg)}}@media(max-width:900px){.grid{grid-template-columns:1fr}.jar-zone{min-height:520px}.top{align-items:flex-start;flex-direction:column}.moods{grid-template-columns:repeat(2,minmax(0,1fr))}.app{padding:12px}.panel{border-radius:18px}.jar{width:230px;height:320px}}@media(max-width:460px){.moods{grid-template-columns:1fr}h1{font-size:24px}.today{width:100%}.comfort{width:calc(100% - 32px)}}
  </style>
</head>
<body>
  <div class="app">
    <header class="top"><div class="brand"><div class="mini-jar"><span class="dot d1"></span><span class="dot d2"></span><span class="dot d3"></span></div><div><h1>心情收集罐</h1><p>每天一颗心情星，慢慢把自己照亮。</p></div></div><div class="today" id="todayText"></div></header>
    <main class="grid">
      <section class="panel"><h2>选择今天的心情</h2><p>拖进罐子，或者点一下投进去。</p><div class="moods" id="moods"></div><div class="actions"><button class="btn" id="reset">重置今天</button><button class="btn primary" id="demo">演示数据</button></div></section>
      <section class="panel jar-zone" id="drop"><div class="hint" id="status">把今天的心情放进罐子</div><div class="jar" id="jar"><div class="shine"></div></div><div class="comfort"><div class="animal" id="animal"><span class="eyes"><i></i><i></i></span><span class="mouth"></span></div><p id="comfort">我在这里陪你。任何心情都可以被温柔地收好。</p></div></section>
      <aside class="panel"><div class="calendar-head"><h2>日历预览</h2><div class="month"><button id="prev">‹</button><strong id="monthTitle"></strong><button id="next">›</button></div></div><div class="week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div class="cal" id="cal"></div><h2 style="margin-top:18px">心情统计</h2><div class="tabs"><button class="tab active" data-range="week">周报</button><button class="tab" data-range="month">月报</button><button class="tab" data-range="year">年报</button></div><div id="report"></div></aside>
    </main>
  </div><div class="toast" id="toast"></div>
<script>
const moods=[{id:'happy',name:'开心',face:'☀️',color:'#ffc84f',comfort:'把这份闪闪发光收好，今天的你很可爱。'},{id:'calm',name:'平静',face:'🌿',color:'#46bfa9',comfort:'安静也很珍贵，慢慢呼吸，世界会放轻脚步。'},{id:'anxious',name:'焦虑',face:'🌧️',color:'#73aef4',comfort:'先把肩膀放下来，一次只处理眼前的一小步。'},{id:'sad',name:'难过',face:'💧',color:'#9a77e8',comfort:'难过可以待一会儿，我会轻轻陪你守着它。'},{id:'angry',name:'生气',face:'🔥',color:'#f4777b',comfort:'你的感受有理由存在，先让心里的火慢慢降温。'},{id:'tired',name:'疲惫',face:'🌙',color:'#8aa0a8',comfort:'今天已经很努力了，可以把自己抱回柔软的地方。'},{id:'thanks',name:'感恩',face:'✨',color:'#74b84a',comfort:'这一点点美好，会在罐子里继续发亮。'},{id:'hope',name:'希望',face:'🌈',color:'#ff9f68',comfort:'希望不需要很大，一点点也足够带你往前。'}];
const $=s=>document.querySelector(s), today=()=>new Date().toISOString().slice(0,10);let records=JSON.parse(localStorage.moodJarRecords||'{}'), view=new Date(), range='week';
function save(){localStorage.moodJarRecords=JSON.stringify(records)}function mood(id){return moods.find(m=>m.id===id)}function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2200)}
function add(id){const key=today();if(records[key]){toast('今天已经放过一颗心情啦');return}records[key]={mood:id,time:new Date().toISOString()};save();comfort(mood(id));render();toast('已经放进罐子里了')}function comfort(m){$('#comfort').innerHTML=`<b>${m.name}被收好啦。</b><br>${m.comfort}`;$('#animal').classList.remove('hug');requestAnimationFrame(()=>$('#animal').classList.add('hug'))}
function renderMoods(){$('#moods').innerHTML=moods.map(m=>`<button class="mood" draggable="true" data-id="${m.id}"><span class="face">${m.face}</span><b>${m.name}</b><p>${m.comfort}</p></button>`).join('');document.querySelectorAll('.mood').forEach(b=>{b.onclick=()=>add(b.dataset.id);b.ondragstart=e=>e.dataTransfer.setData('text/plain',b.dataset.id)})}
function renderJar(){document.querySelectorAll('.token').forEach(t=>t.remove());Object.entries(records).slice(-18).forEach(([d,r],i)=>{const m=mood(r.mood),t=document.createElement('div');t.className='token';t.textContent=m.face;t.style.background=m.color;t.style.left=42+(i*43%170)+'px';t.style.bottom=26+Math.floor(i/4)*45+'px';$('#jar').appendChild(t)});$('#status').textContent=records[today()]?'今天的心情已经收好':'把今天的心情放进罐子';$('#todayText').textContent=new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'})+(records[today()]?' · 已记录':' · 未记录')}
function renderCal(){const y=view.getFullYear(),m=view.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0);$('#monthTitle').textContent=`${y}年${m+1}月`;let html='';for(let i=0;i<first.getDay();i++)html+='<div class="day muted"></div>';for(let d=1;d<=last.getDate();d++){const key=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,r=records[key],mm=r&&mood(r.mood);html+=`<div class="day">${d}${mm?`<span class="mark" style="background:${mm.color}"></span>`:''}</div>`}$('#cal').innerHTML=html}
function rangeEntries(){const now=new Date(),start=new Date();if(range==='week')start.setDate(now.getDate()-now.getDay());else if(range==='month')start.setDate(1);else start.setMonth(0,1);start.setHours(0,0,0,0);return Object.entries(records).filter(([k])=>new Date(k+'T00:00:00')>=start&&new Date(k+'T00:00:00')<=now)}
function renderReport(){const rows=rangeEntries(),counts={};rows.forEach(([,r])=>counts[r.mood]=(counts[r.mood]||0)+1);let html='';moods.filter(m=>counts[m.id]).sort((a,b)=>counts[b.id]-counts[a.id]).forEach(m=>{const n=counts[m.id],pct=Math.round(n/rows.length*100);html+=`<div class="report-row"><b>${m.face} ${m.name}</b><span>${n}天</span><div class="bar"><i style="width:${pct}%;background:${m.color}"></i></div><span>${pct}%</span></div>`});$('#report').innerHTML=html||'<p>这里还没有记录，今天可以开始放第一颗。</p>'}
function render(){renderJar();renderCal();renderReport()}renderMoods();render();$('#drop').ondragover=e=>{e.preventDefault();$('#drop').classList.add('ready')};$('#drop').ondragleave=()=>$('#drop').classList.remove('ready');$('#drop').ondrop=e=>{e.preventDefault();$('#drop').classList.remove('ready');add(e.dataTransfer.getData('text/plain'))};$('#prev').onclick=()=>{view.setMonth(view.getMonth()-1);renderCal()};$('#next').onclick=()=>{view.setMonth(view.getMonth()+1);renderCal()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');range=b.dataset.range;renderReport()});$('#reset').onclick=()=>{delete records[today()];save();render();toast('今天可以重新选择啦')};$('#demo').onclick=()=>{for(let i=0;i<28;i++){let d=new Date();d.setDate(d.getDate()-i);records[d.toISOString().slice(0,10)]={mood:moods[(i*3)%moods.length].id,time:d.toISOString()}}save();render();toast('演示数据已经放好')};
</script>
</body>
</html>
