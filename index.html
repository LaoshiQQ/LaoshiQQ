  <title>心情收集罐</title>
  <style>
    :root{--ink:#21313a;--muted:#6c7b84;--line:#dbe9e7;--mint:#45bfa9;--mint-dark:#238c7b;--gold:#ffc84f;--coral:#f4777b;--sky:#73aef4;--lilac:#9a77e8;--shadow:0 18px 44px rgba(35,94,92,.12);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}*{box-sizing:border-box}html,body{min-height:100%;overflow-x:hidden}body{margin:0;color:var(--ink);background:radial-gradient(circle at 50% 5%,rgba(255,200,79,.18),transparent 25%),radial-gradient(circle at 10% 26%,rgba(116,184,74,.14),transparent 28%),linear-gradient(180deg,#f7fbfb 0%,#edf8f6 52%,#fff8ea 100%)}button{font:inherit;color:inherit}.app{width:100%;max-width:460px;min-height:100svh;margin:auto;padding:calc(12px + env(safe-area-inset-top)) 12px calc(94px + env(safe-area-inset-bottom))}.top{position:sticky;top:0;z-index:20;margin:-12px -12px 10px;padding:calc(12px + env(safe-area-inset-top)) 12px 12px;background:linear-gradient(180deg,rgba(247,251,251,.96),rgba(247,251,251,.72));backdrop-filter:blur(18px);display:grid;gap:10px}.brand{display:flex;align-items:center;gap:12px}.mini-jar{position:relative;flex:0 0 auto;width:38px;height:50px;border:3px solid #287d78;border-radius:12px 12px 15px 15px;background:rgba(255,255,255,.75);box-shadow:inset 0 0 12px rgba(95,191,206,.22)}.mini-jar:before{content:"";position:absolute;left:8px;top:-8px;width:20px;height:8px;border-radius:8px;background:#d59d62}.mini-jar span{position:absolute;bottom:8px;width:12px;height:12px;border-radius:50%}.mini-jar span:nth-child(1){left:7px;background:var(--gold)}.mini-jar span:nth-child(2){left:17px;background:var(--mint)}.mini-jar span:nth-child(3){left:24px;background:var(--coral)}h1,h2,p{margin:0}h1{font-size:24px;line-height:1.08}.brand p{max-width:250px;margin-top:5px;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.today{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.76);box-shadow:var(--shadow);font-size:14px;font-weight:800}.status{flex:0 0 auto;padding:6px 9px;border-radius:999px;background:#fff7dd;color:#9a6b00;font-size:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button,.tabbar button,.tabs button,.month button{border:0;cursor:pointer}.actions button{min-height:40px;border:1px solid rgba(219,233,231,.9);border-radius:14px;background:rgba(255,255,255,.72);font-size:13px;font-weight:800}.card{display:none;border:1px solid rgba(219,233,231,.94);border-radius:24px;background:rgba(255,255,255,.82);box-shadow:var(--shadow);backdrop-filter:blur(14px);padding:16px}.view-mood .mood-card,.view-jar .jar-card,.view-calendar .calendar-card,.view-report .report-card{display:block}.head{display:flex;align-items:center;justify-content:space-between;gap:12px}.head p{margin-top:6px;color:var(--muted);font-size:14px}.moods{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.mood{min-height:112px;border:1px solid color-mix(in srgb,var(--c) 52%,white);border-radius:18px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 14%,white),rgba(255,255,255,.78));display:grid;place-items:center;gap:6px;touch-action:manipulation}.mood:disabled{opacity:.44;filter:grayscale(.25)}.face{font-size:34px;filter:drop-shadow(0 8px 10px rgba(34,54,62,.12))}.mood b{color:color-mix(in srgb,var(--c) 74%,#23313a);font-size:17px}.rule{display:flex;gap:10px;margin-top:14px;padding:12px 14px;border:1px solid #cbdcfb;border-radius:18px;background:linear-gradient(135deg,#f1f6ff,#fbfdff);color:#4970bd}.rule b,.rule span{display:block}.rule span{margin-top:4px;color:#7688b2;font-size:13px}.jar-card{min-height:calc(100svh - 206px);padding:16px 14px 18px}.drop{min-height:370px;display:grid;place-items:center}.drop-msg{width:100%;padding:12px 14px;border:1px solid #a9ded5;border-radius:18px;background:rgba(255,255,255,.78);text-align:center;box-shadow:0 14px 32px rgba(37,118,114,.12)}.drop-msg b{display:block;color:var(--mint-dark);font-size:17px}.drop-msg span{display:block;margin-top:6px;color:var(--muted)}.jar{position:relative;width:min(302px,86vw);height:370px;filter:drop-shadow(0 28px 40px rgba(61,105,111,.17))}.jar:before{content:"";position:absolute;inset:76px 28px 26px;border:8px solid rgba(122,176,190,.48);border-top-width:14px;border-radius:46px 46px 70px 70px/42px 42px 78px 78px;background:linear-gradient(100deg,rgba(255,255,255,.78),rgba(255,255,255,.18) 32%,rgba(119,191,210,.12) 68%,rgba(255,255,255,.5)),rgba(255,255,255,.26);box-shadow:inset 12px 0 28px rgba(255,255,255,.78),inset -18px 0 28px rgba(98,159,179,.18)}.lid{position:absolute;top:42px;left:50%;width:64%;height:48px;transform:translateX(-50%);border-radius:50%;background:linear-gradient(180deg,#d5ad77,#b8824f);box-shadow:inset 0 8px 10px rgba(255,255,255,.45),0 8px 0 rgba(93,88,68,.18);z-index:4}.neck{position:absolute;top:76px;left:50%;width:73%;height:42px;transform:translateX(-50%);border:8px solid rgba(122,176,190,.42);border-radius:50%;background:rgba(255,255,255,.42);z-index:3}.fill{position:absolute;left:46px;right:46px;bottom:48px;height:175px;z-index:2}.token{position:absolute;width:36px;height:36px;display:grid;place-items:center;font-size:22px;animation:settle .52s cubic-bezier(.2,.9,.2,1) both}.token:before{content:"";position:absolute;inset:4px;border-radius:40% 58% 48% 52%;background:color-mix(in srgb,var(--c) 62%,white);opacity:.82;box-shadow:inset 8px 8px 12px rgba(255,255,255,.5),0 6px 10px rgba(37,75,91,.12);transform:rotate(45deg)}.token span{position:relative;z-index:1;transform:scale(.72)}@keyframes settle{from{transform:translateY(-180px) rotate(-18deg) scale(.65);opacity:0}to{transform:translateY(0) rotate(var(--rot,0deg)) scale(1);opacity:1}}.tag{position:absolute;top:132px;right:12px;z-index:5;padding:12px 10px;color:#9a6b3f;text-align:center;font-weight:800;line-height:1.35;background:#d9ad72;border-radius:6px 6px 10px 10px;transform:rotate(-8deg);box-shadow:0 10px 18px rgba(68,49,29,.15);font-size:13px}.shine{position:absolute;top:132px;left:76px;z-index:5;width:34px;height:190px;border-radius:50%;background:linear-gradient(90deg,rgba(255,255,255,.72),transparent);filter:blur(1px)}.comfort{display:grid;gap:8px;margin-top:-10px}.bubble{width:100%;padding:14px 16px;border:1px solid #a9ded5;border-radius:18px;background:rgba(255,255,255,.82);box-shadow:0 14px 32px rgba(37,118,114,.12);line-height:1.45}.bubble b{display:block;color:var(--mint-dark);margin-bottom:6px}.pet{justify-self:center;width:120px;height:112px;position:relative}.pet .body{position:absolute;left:17px;bottom:10px;width:86px;height:86px;border-radius:48% 48% 42% 42%;background:#fff7ef;border:3px solid #b77f65}.pet:before,.pet:after{content:"";position:absolute;top:4px;width:28px;height:48px;border-radius:50% 50% 40% 40%;background:#fff7ef;border:3px solid #b77f65}.pet:before{left:23px;transform:rotate(-18deg)}.pet:after{right:23px;transform:rotate(18deg)}.eyes{position:absolute;top:34px;left:24px;right:24px;display:flex;justify-content:space-between}.eyes i{width:8px;height:10px;border-radius:50%;background:#493129}.mouth{position:absolute;top:51px;left:39px;width:13px;height:8px;border-bottom:3px solid #493129;border-radius:50%}.pet.hug{animation:hug .7s ease 2}@keyframes hug{50%{transform:scale(1.12) rotate(-3deg)}}.stats{display:grid;margin-top:10px;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.72);overflow:hidden}.stats div{padding:12px 14px;border-bottom:1px dashed #cddfdd}.stats div:last-child{border-bottom:0}.stats span{display:block;color:var(--muted);font-size:12px}.stats b{font-size:20px}.bar{height:8px;margin-top:8px;border-radius:999px;background:#dfecea;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--gold))}.month{display:flex;align-items:center;gap:8px}.month button{width:38px;height:38px;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:22px}.week,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.week{margin-top:16px;color:#62727d;font-weight:800;text-align:center;font-size:13px}.cal{margin-top:10px}.day{min-height:40px;border-radius:14px;display:grid;place-items:center;font-size:13px;position:relative}.day.muted{color:#a9b4ba}.day.today{background:var(--mint);color:#fff;font-weight:900}.dot{width:7px;height:7px;border-radius:50%;background:var(--c);position:absolute;bottom:5px}.tabs{display:flex;gap:4px;margin:14px 0;padding:4px;border-radius:16px;border:1px solid var(--line);background:#f7fbfa}.tabs button{flex:1;min-height:38px;border-radius:12px;background:transparent;font-weight:900;color:#64747d}.tabs button.active{background:var(--mint);color:white}.report-row{display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:8px;margin:10px 0}.report-row .bar{margin:0}.summary{margin-top:14px;padding:14px;border-radius:18px;background:#fff9e7;border:1px solid #f1d9a8;color:#85651d}.tabbar{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:436px;margin:auto;padding:8px;border:1px solid rgba(196,224,219,.94);border-radius:26px;background:rgba(255,255,255,.82);box-shadow:0 18px 38px rgba(35,94,92,.18);backdrop-filter:blur(18px)}.tabbar button{display:grid;place-items:center;gap:2px;min-height:50px;border-radius:20px;background:transparent;color:#6c7b84;font-size:12px;font-weight:900}.tabbar button span{font-size:20px;line-height:1}.tabbar button.active{color:#fff;background:linear-gradient(135deg,var(--mint),#73aef4);box-shadow:0 10px 22px rgba(69,191,169,.24)}.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));z-index:50;max-width:calc(100vw - 28px);transform:translateX(-50%) translateY(20px);opacity:0;padding:12px 16px;border-radius:999px;background:#20333b;color:white;text-align:center;transition:.25s}.toast.show{opacity:1;transform:translateX(-50%)}@media(min-width:761px){.app{max-width:1180px}.screen{display:grid;grid-template-columns:320px 1fr 360px;gap:14px}.card{display:block}.tabbar{display:none}.jar-card{min-height:620px}.view-mood .mood-card,.view-jar .jar-card,.view-calendar .calendar-card,.view-report .report-card{display:block}}
  </style>
</head>
<body class="view-mood">
  <div class="app">
    <header class="top"><div class="brand"><div class="mini-jar"><span></span><span></span><span></span></div><div><h1>心情收集罐</h1><p>每天一颗心情星，点亮生活的小美好</p></div></div><div class="today"><strong id="todayText"></strong><span id="todayStatus" class="status">今日未记录</span></div><div class="actions"><button id="reset">重置今天</button><button id="demo">演示数据</button></div></header>
    <main class="screen">
      <section class="card mood-card"><div class="head"><div><h2>选择今天的心情</h2><p>点一下投进罐子，iPhone 上也很顺手。</p></div></div><div id="moods" class="moods"></div><div class="rule"><span>⏱</span><div><b>每天只能记录一种心情哦</b><span>记录是给自己的温柔陪伴</span></div></div></section>
      <section class="card jar-card"><div class="drop"><div class="drop-msg"><b id="dropTitle">把今天的心情放进罐子</b><span>一天一颗，刚刚好</span></div><div class="jar"><div class="lid"></div><div class="neck"></div><div id="fill" class="fill"></div><div class="tag">2026<br>心情收集</div><div class="shine"></div></div></div><div class="comfort"><div id="bubble" class="bubble"><b>今天还没有投入心情</b>选一颗心情星，我会陪你一起放好。</div><div id="pet" class="pet"><div class="body"><span class="eyes"><i></i><i></i></span><span class="mouth"></span></div></div></div><div class="stats"><div><span>罐子进度</span><b id="progress">0/365</b><div class="bar"><i id="progressBar"></i></div></div><div><span>连续记录</span><b id="streak">0 天</b></div><div><span>心情总数</span><b id="total">0 颗</b></div></div></section>
      <aside><section class="card calendar-card"><div class="head"><h2>心情日历</h2><div class="month"><button id="prev">‹</button><strong id="monthTitle"></strong><button id="next">›</button></div></div><div class="week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div id="cal" class="cal"></div></section><section class="card report-card"><div class="head"><h2>心情统计</h2></div><div class="tabs"><button class="active" data-range="week">周报</button><button data-range="month">月报</button><button data-range="year">年报</button></div><div id="report"></div><div id="summary" class="summary">投一颗心情后，这里会出现温柔总结。</div></section></aside>
    </main>
  </div>
  <nav class="tabbar"><button class="active" data-view="mood"><span>✦</span>心情</button><button data-view="jar"><span>◠</span>罐子</button><button data-view="calendar"><span>□</span>日历</button><button data-view="report"><span>◌</span>统计</button></nav><div id="toast" class="toast"></div>
  <script>
    const moods=[{id:'happy',name:'开心',icon:'⭐',color:'#ffc84f',comfort:'这份开心被好好收进罐子啦。愿它在今天多闪几次光。'},{id:'calm',name:'平静',icon:'☁',color:'#66d6bd',comfort:'平静也很珍贵。慢慢呼吸，你已经把今天照顾得很好。'},{id:'anxious',name:'焦虑',icon:'〰',color:'#9a77e8',comfort:'焦虑可以先放在罐子里。我陪你把它变小一点，再一步一步来。'},{id:'sad',name:'难过',icon:'💧',color:'#73aef4',comfort:'难过被温柔接住了。今天不用很坚强，先对自己轻一点。'},{id:'angry',name:'生气',icon:'🔥',color:'#f4777b',comfort:'生气说明你的边界在说话。先把火放下，我们一起慢慢降温。'},{id:'tired',name:'疲惫',icon:'☾',color:'#9d82cf',comfort:'辛苦啦。疲惫也值得被记录，今天可以给自己多一点休息。'},{id:'grateful',name:'感恩',icon:'♥',color:'#ff8fa3',comfort:'这颗感恩星亮起来了。小小的好，也会把一天照得柔软。'},{id:'hopeful',name:'希望',icon:'🌱',color:'#78bd55',comfort:'希望已经发芽。哪怕只是一点点，也足够陪你往前走。'}];
    const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s), key='mood-jar-records-v2';let records=JSON.parse(localStorage.getItem(key)||'{}'), month=new Date(), range='week';
    const dateKey=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const mood=id=>moods.find(m=>m.id===id);function save(){localStorage.setItem(key,JSON.stringify(records))}function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toast').classList.remove('show'),2200)}function setView(v){document.body.className='view-'+v;$$('.tabbar button').forEach(b=>b.classList.toggle('active',b.dataset.view===v))}
    function renderMoods(){ $('#moods').innerHTML=moods.map(m=>`<button class="mood" data-id="${m.id}" style="--c:${m.color}"><span class="face">${m.icon}</span><b>${m.name}</b></button>`).join('');$$('.mood').forEach(b=>b.onclick=()=>add(b.dataset.id))}
    function add(id){const k=dateKey(),m=mood(id);if(records[k]){toast(`今天已经收集过「${mood(records[k].mood).name}」啦`);return}records[k]={mood:id,createdAt:new Date().toISOString()};save();render();comfort(m);setView('jar');toast(`「${m.name}」已经轻轻放进罐子。`)}
    function comfort(m){$('#bubble').innerHTML=`<b>${m.name}被收好啦</b>${m.comfort}`;$('#pet').classList.remove('hug');requestAnimationFrame(()=>$('#pet').classList.add('hug'))}
    function renderToday(){const r=records[dateKey()];$('#todayText').textContent=new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});$('#todayStatus').textContent=r?'今天已记录':'今日未记录';$('#todayStatus').style.background=r?'#e3f8f0':'#fff7dd';$('#todayStatus').style.color=r?'var(--mint-dark)':'#9a6b00';$$('.mood').forEach(b=>b.disabled=!!r);$('#dropTitle').textContent=r?'今天的心情已经收好':'把今天的心情放进罐子'}
    function renderJar(){ $('#fill').innerHTML='';Object.entries(records).slice(-18).forEach(([d,r],i)=>{const m=mood(r.mood),t=document.createElement('div');t.className='token';t.style.cssText=`--c:${m.color};left:${(i*37)%170}px;bottom:${8+Math.floor(i/4)*38}px;--rot:${-14+(i*11)%28}deg`;t.innerHTML=`<span>${m.icon}</span>`;$('#fill').appendChild(t)})}
    function renderStats(){const total=Object.keys(records).length;$('#progress').textContent=`${total}/365`;$('#progressBar').style.width=Math.min(100,total/365*100)+'%';$('#total').textContent=`${total} 颗`;let s=0,d=new Date();while(records[dateKey(d)]){s++;d.setDate(d.getDate()-1)}$('#streak').textContent=`${s} 天`}
    function renderCal(){const y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0);$('#monthTitle').textContent=`${y}年${m+1}月`;let html='';for(let i=0;i<first.getDay();i++)html+='<div class="day muted"></div>';for(let d=1;d<=last.getDate();d++){const k=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,r=records[k],mm=r&&mood(r.mood);html+=`<div class="day ${k===dateKey()?'today':''}">${d}${mm?`<span class="dot" style="--c:${mm.color}"></span>`:''}</div>`}$('#cal').innerHTML=html}
    function entries(){const now=new Date(),start=new Date();if(range==='week')start.setDate(now.getDate()-now.getDay());else if(range==='month')start.setDate(1);else start.setMonth(0,1);start.setHours(0,0,0,0);return Object.entries(records).filter(([k])=>new Date(k+'T00:00:00')>=start&&new Date(k+'T00:00:00')<=now)}
    function renderReport(){const rows=entries(),counts={};rows.forEach(([,r])=>counts[r.mood]=(counts[r.mood]||0)+1);let top=null,html='';moods.filter(m=>counts[m.id]).sort((a,b)=>counts[b.id]-counts[a.id]).forEach(m=>{top=top||m;const n=counts[m.id],pct=Math.round(n/rows.length*100);html+=`<div class="report-row"><b>${m.icon} ${m.name}</b><span>${n}天</span><div class="bar"><i style="width:${pct}%;background:${m.color}"></i></div><span>${pct}%</span></div>`});$('#report').innerHTML=html||'<p>这里还没有记录，今天可以开始放第一颗。</p>';$('#summary').textContent=top?`这段时间里「${top.name}」出现最多。无论是哪一种心情，都已经被你认真看见了。`:'投一颗心情后，这里会出现温柔总结。'}
    function render(){renderToday();renderJar();renderStats();renderCal();renderReport()}renderMoods();render();$$('.tabbar button').forEach(b=>b.onclick=()=>setView(b.dataset.view));$('#prev').onclick=()=>{month.setMonth(month.getMonth()-1);renderCal()};$('#next').onclick=()=>{month.setMonth(month.getMonth()+1);renderCal()};$$('.tabs button').forEach(b=>b.onclick=()=>{$$('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');range=b.dataset.range;renderReport()});$('#reset').onclick=()=>{delete records[dateKey()];save();render();toast('今天可以重新选择啦')};$('#demo').onclick=()=>{for(let i=0;i<28;i++){const d=new Date();d.setDate(d.getDate()-i);records[dateKey(d)]={mood:moods[(i*3)%moods.length].id,createdAt:d.toISOString()}}save();render();toast('演示数据已经放好')};
  </script>
</body>
</html>
