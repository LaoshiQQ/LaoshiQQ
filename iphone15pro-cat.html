<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#45bfa9"><title>心情收集罐 猫猫版</title><style>:root{--ink:#21313a;--muted:#6c7b84;--line:#dbe9e7;--mint:#45bfa9;--gold:#ffc84f;--coral:#f4777b;--sky:#73aef4;--shadow:0 18px 44px rgba(35,94,92,.12);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(circle at 50% 5%,rgba(255,200,79,.18),transparent 25%),linear-gradient(180deg,#f7fbfb,#edf8f6 52%,#fff8ea);min-height:100svh;overflow-x:hidden}button{font:inherit}.app{max-width:460px;margin:auto;padding:calc(12px + env(safe-area-inset-top)) 12px calc(94px + env(safe-area-inset-bottom))}.top{position:sticky;top:0;z-index:5;margin:-12px -12px 10px;padding:calc(12px + env(safe-area-inset-top)) 12px 12px;background:rgba(247,251,251,.88);backdrop-filter:blur(18px);display:grid;gap:10px}.brand{display:flex;gap:12px;align-items:center}.mini{width:38px;height:50px;border:3px solid #287d78;border-radius:12px 12px 15px 15px;background:rgba(255,255,255,.75);position:relative}.mini:before{content:"";position:absolute;left:8px;top:-8px;width:20px;height:8px;border-radius:8px;background:#d59d62}.mini i{position:absolute;bottom:8px;width:12px;height:12px;border-radius:50%}.mini i:nth-child(1){left:7px;background:var(--gold)}.mini i:nth-child(2){left:17px;background:var(--mint)}.mini i:nth-child(3){left:24px;background:var(--coral)}h1,h2,p{margin:0}h1{font-size:24px}.brand p{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:250px}.today,.card{border:1px solid var(--line);background:rgba(255,255,255,.82);box-shadow:var(--shadow)}.today{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:16px;font-weight:800;font-size:14px}.pill{border-radius:999px;padding:6px 9px;background:#fff7dd;color:#9a6b00;font-size:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button{border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.75);min-height:40px;font-weight:800}.card{display:none;border-radius:24px;padding:16px;backdrop-filter:blur(14px)}body.mood .moodPage,body.jar .jarPage,body.cal .calPage,body.report .reportPage{display:block}.head p{margin-top:6px;color:var(--muted);font-size:14px}.moods{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.mood{min-height:112px;border:1px solid color-mix(in srgb,var(--c) 52%,white);border-radius:18px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 14%,white),rgba(255,255,255,.78));display:grid;place-items:center;gap:6px;border-color:color-mix(in srgb,var(--c) 42%,white)}.mood:disabled{opacity:.44}.face{font-size:34px}.mood b{font-size:17px;color:color-mix(in srgb,var(--c) 74%,#23313a)}.rule{margin-top:14px;padding:12px 14px;border-radius:18px;background:#f1f6ff;color:#4970bd}.jarPage{min-height:calc(100svh - 206px);padding:16px 14px}.drop{display:grid;place-items:center;min-height:370px}.msg{width:100%;padding:12px;border:1px solid #a9ded5;border-radius:18px;background:rgba(255,255,255,.78);text-align:center}.msg b{display:block;color:#238c7b}.msg span{display:block;margin-top:6px;color:var(--muted)}.jar{position:relative;width:min(302px,86vw);height:370px;filter:drop-shadow(0 28px 40px rgba(61,105,111,.17))}.jar:before{content:"";position:absolute;inset:76px 28px 26px;border:8px solid rgba(122,176,190,.48);border-top-width:14px;border-radius:46px 46px 70px 70px/42px 42px 78px 78px;background:linear-gradient(100deg,rgba(255,255,255,.78),rgba(255,255,255,.18),rgba(119,191,210,.12),rgba(255,255,255,.5));box-shadow:inset 12px 0 28px rgba(255,255,255,.78),inset -18px 0 28px rgba(98,159,179,.18)}.lid{position:absolute;top:42px;left:50%;width:64%;height:48px;transform:translateX(-50%);border-radius:50%;background:linear-gradient(180deg,#d5ad77,#b8824f);z-index:4}.neck{position:absolute;top:76px;left:50%;width:73%;height:42px;transform:translateX(-50%);border:8px solid rgba(122,176,190,.42);border-radius:50%;background:rgba(255,255,255,.42);z-index:3}.fill{position:absolute;left:46px;right:46px;bottom:48px;height:175px;z-index:2}.token{position:absolute;width:36px;height:36px;display:grid;place-items:center;font-size:22px;animation:drop .52s both}.token:before{content:"";position:absolute;inset:4px;border-radius:40% 58% 48% 52%;background:color-mix(in srgb,var(--c) 62%,white);opacity:.84;transform:rotate(45deg)}.token span{position:relative;z-index:1;transform:scale(.72)}@keyframes drop{from{transform:translateY(-160px) scale(.65);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}.tag{position:absolute;top:132px;right:12px;z-index:5;padding:12px 10px;color:#9a6b3f;text-align:center;font-weight:800;background:#d9ad72;border-radius:6px 6px 10px 10px;transform:rotate(-8deg);font-size:13px}.shine{position:absolute;top:132px;left:76px;width:34px;height:190px;border-radius:50%;background:linear-gradient(90deg,rgba(255,255,255,.72),transparent);filter:blur(1px);z-index:5}.bubble{margin-top:-8px;padding:14px 16px;border:1px solid #a9ded5;border-radius:18px;background:white;line-height:1.45}.bubble b{display:block;color:#238c7b;margin-bottom:6px}.cat{margin:8px auto 0;width:150px;height:136px;position:relative}.cat:after{content:"";position:absolute;left:16px;right:16px;bottom:1px;height:20px;border-radius:50%;background:rgba(85,129,118,.14)}.cat .body{position:absolute;left:19px;bottom:18px;width:112px;height:112px;border-radius:50% 50% 47% 47%;background:#fff0e4;box-shadow:inset -12px -18px 20px rgba(242,203,185,.32),0 14px 25px rgba(76,93,93,.12);animation:breathe 2.5s ease-in-out infinite}.cat .ear{position:absolute;top:13px;width:40px;height:40px;background:#fff0e4;clip-path:polygon(50% 0,100% 100%,0 100%)}.cat .ear:after{content:"";position:absolute;left:12px;top:13px;width:16px;height:18px;background:#f7b6a6;clip-path:polygon(50% 0,100% 100%,0 100%)}.cat .l{left:39px;transform:rotate(-18deg)}.cat .r{right:35px;transform:rotate(18deg)}.cat .eye{position:absolute;top:54px;width:22px;height:11px;border-bottom:3px solid #5d4a43;border-radius:50%;z-index:3}.cat .eye.left{left:45px}.cat .eye.right{right:45px}.cat .cheek{position:absolute;top:80px;width:28px;height:24px;border-radius:50%;background:rgba(248,207,195,.58);z-index:3}.cat .cheek.left{left:32px}.cat .cheek.right{right:32px}.cat .nose{position:absolute;top:77px;left:72px;width:7px;height:7px;border-radius:50%;background:#e9898e;z-index:4}.fish{position:absolute;left:61px;top:84px;width:30px;height:42px;background:#8bd4a4;clip-path:polygon(50% 0,76% 22%,62% 100%,50% 88%,38% 100%,24% 22%);z-index:4}.fish:after{content:"";position:absolute;bottom:0;left:3px;width:24px;height:16px;background:#8bd4a4;clip-path:polygon(50% 0,100% 100%,50% 72%,0 100%)}.cat.hug .body{animation:hug .7s ease,breathe 2.5s ease-in-out .8s infinite}@keyframes breathe{50%{transform:translateY(-3px) scale(1.02)}}@keyframes hug{45%{transform:translateY(-7px) scale(1.08)}}.stats{display:grid;margin-top:10px;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.72);overflow:hidden}.stats div{padding:12px 14px;border-bottom:1px dashed #cddfdd}.stats div:last-child{border:0}.stats span{display:block;color:var(--muted);font-size:12px}.stats b{font-size:20px}.bar{height:8px;margin-top:8px;border-radius:999px;background:#dfecea;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--gold));width:0}.month{display:flex;align-items:center;justify-content:space-between;gap:8px}.month button{width:38px;height:38px;border-radius:14px;background:white;border:1px solid var(--line);font-size:22px}.week,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.week{margin-top:16px;color:#62727d;font-weight:800;text-align:center;font-size:13px}.cal{margin-top:10px}.day{min-height:40px;border-radius:14px;display:grid;place-items:center;font-size:13px;position:relative}.day.today{background:var(--mint);color:white;font-weight:900}.dot{position:absolute;bottom:5px;width:7px;height:7px;border-radius:50%;background:var(--c)}.tabs{display:flex;gap:4px;margin:14px 0;padding:4px;border:1px solid var(--line);border-radius:16px;background:#f7fbfa}.tabs button{flex:1;border:0;min-height:38px;border-radius:12px;background:transparent;font-weight:900;color:#64747d}.tabs button.active{background:var(--mint);color:white}.row{display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:8px;margin:10px 0}.summary{margin-top:14px;padding:14px;border-radius:18px;background:#fff9e7;border:1px solid #f1d9a8;color:#85651d}.tabbar{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:20;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:436px;margin:auto;padding:8px;border:1px solid rgba(196,224,219,.94);border-radius:26px;background:rgba(255,255,255,.82);box-shadow:0 18px 38px rgba(35,94,92,.18);backdrop-filter:blur(18px)}.tabbar button{border:0;display:grid;place-items:center;gap:2px;min-height:50px;border-radius:20px;background:transparent;color:#6c7b84;font-size:12px;font-weight:900}.tabbar button span{font-size:20px}.tabbar button.active{color:white;background:linear-gradient(135deg,var(--mint),#73aef4)}.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));z-index:30;max-width:calc(100vw - 28px);transform:translateX(-50%) translateY(20px);opacity:0;padding:12px 16px;border-radius:999px;background:#20333b;color:white;text-align:center;transition:.25s}.toast.show{opacity:1;transform:translateX(-50%)}</style></head><body class="mood"><div class="app"><header class="top"><div class="brand"><div class="mini"><i></i><i></i><i></i></div><div><h1>心情收集罐</h1><p>每天一颗心情星，猫猫陪你收好</p></div></div><div class="today"><strong id="today"></strong><span id="state" class="pill">今日未记录</span></div><div class="actions"><button id="reset">重置今天</button><button id="demo">演示数据</button></div></header><main><section class="card moodPage"><div class="head"><h2>选择今天的心情</h2><p>点一下投进罐子，iPhone 15 Pro 竖屏刚刚好。</p></div><div id="moods" class="moods"></div><div class="rule"><b>每天只能记录一种心情哦</b><span>记录是给自己的温柔陪伴</span></div></section><section class="card jarPage"><div class="drop"><div class="msg"><b id="dropTitle">把今天的心情放进罐子</b><span>一天一颗，刚刚好</span></div><div class="jar"><div class="lid"></div><div class="neck"></div><div id="fill" class="fill"></div><div class="tag">2026<br>心情收集</div><div class="shine"></div></div></div><div id="bubble" class="bubble"><b>今天还没有投入心情</b>选一颗心情星，猫猫会叼着小鱼陪你一起放好。</div><div id="cat" class="cat"><div class="ear l"></div><div class="ear r"></div><div class="body"></div><span class="eye left"></span><span class="eye right"></span><span class="cheek left"></span><span class="cheek right"></span><span class="nose"></span><span class="fish"></span></div><div class="stats"><div><span>罐子进度</span><b id="progress">0/365</b><div class="bar"><i id="progressBar"></i></div></div><div><span>连续记录</span><b id="streak">0 天</b></div><div><span>心情总数</span><b id="total">0 颗</b></div></div></section><section class="card calPage"><div class="month"><h2>心情日历</h2><div><button id="prev">‹</button><strong id="month"></strong><button id="next">›</button></div></div><div class="week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div id="cal" class="cal"></div></section><section class="card reportPage"><h2>心情统计</h2><div class="tabs"><button class="active" data-r="week">周报</button><button data-r="month">月报</button><button data-r="year">年报</button></div><div id="report"></div><div id="summary" class="summary">投一颗心情后，这里会出现温柔总结。</div></section></main></div><nav class="tabbar"><button class="active" data-v="mood"><span>✦</span>心情</button><button data-v="jar"><span>◠</span>罐子</button><button data-v="cal"><span>□</span>日历</button><button data-v="report"><span>◌</span>统计</button></nav><div id="toast" class="toast"></div><script>const moods=[{id:'happy',name:'开心',icon:'⭐',color:'#ffc84f',comfort:'这份开心被好好收进罐子啦。愿它在今天多闪几次光。'},{id:'calm',name:'平静',icon:'☁',color:'#66d6bd',comfort:'平静也很珍贵。慢慢呼吸，你已经把今天照顾得很好。'},{id:'anxious',name:'焦虑',icon:'〰',color:'#9a77e8',comfort:'焦虑可以先放在罐子里。我陪你把它变小一点。'},{id:'sad',name:'难过',icon:'💧',color:'#73aef4',comfort:'难过被温柔接住了。今天不用很坚强，先对自己轻一点。'},{id:'angry',name:'生气',icon:'🔥',color:'#f4777b',comfort:'生气说明你的边界在说话。先把火放下，我们一起慢慢降温。'},{id:'tired',name:'疲惫',icon:'☾',color:'#9d82cf',comfort:'辛苦啦。疲惫也值得被记录，今天可以给自己多一点休息。'},{id:'grateful',name:'感恩',icon:'♥',color:'#ff8fa3',comfort:'小小的好，也会把一天照得柔软。'},{id:'hopeful',name:'希望',icon:'🌱',color:'#78bd55',comfort:'希望已经发芽，一点点也足够陪你往前走。'}];const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s),key='mood-cat-v1';let records=JSON.parse(localStorage.getItem(key)||'{}'),view=new Date(),range='week';const dk=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,mood=id=>moods.find(m=>m.id===id);function save(){localStorage.setItem(key,JSON.stringify(records))}function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toast').classList.remove('show'),2200)}function setView(v){document.body.className=v;$$('.tabbar button').forEach(b=>b.classList.toggle('active',b.dataset.v===v))}function renderMoods(){$('#moods').innerHTML=moods.map(m=>`<button class="mood" data-id="${m.id}" style="--c:${m.color}"><span class="face">${m.icon}</span><b>${m.name}</b></button>`).join('');$$('.mood').forEach(b=>b.onclick=()=>add(b.dataset.id))}function add(id){const k=dk(),m=mood(id);if(records[k]){toast(`今天已经收集过「${mood(records[k].mood).name}」啦`);return}records[k]={mood:id,createdAt:new Date().toISOString()};save();render();$('#bubble').innerHTML=`<b>${m.name}被猫猫收好啦</b>${m.comfort}`;$('#cat').classList.remove('hug');requestAnimationFrame(()=>$('#cat').classList.add('hug'));setView('jar');toast(`「${m.name}」已经轻轻放进罐子。`)}function renderToday(){const r=records[dk()];$('#today').textContent=new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});$('#state').textContent=r?'今天已记录':'今日未记录';$('#state').style.background=r?'#e3f8f0':'#fff7dd';$('#state').style.color=r?'#238c7b':'#9a6b00';$$('.mood').forEach(b=>b.disabled=!!r);$('#dropTitle').textContent=r?'今天的心情已经收好':'把今天的心情放进罐子'}function renderJar(){$('#fill').innerHTML='';Object.entries(records).slice(-18).forEach(([d,r],i)=>{const m=mood(r.mood),t=document.createElement('div');t.className='token';t.style.cssText=`--c:${m.color};left:${(i*37)%170}px;bottom:${8+Math.floor(i/4)*38}px`;t.innerHTML=`<span>${m.icon}</span>`;$('#fill').appendChild(t)})}function renderStats(){const n=Object.keys(records).length;$('#progress').textContent=`${n}/365`;$('#progressBar').style.width=Math.min(100,n/365*100)+'%';$('#total').textContent=`${n} 颗`;let s=0,d=new Date();while(records[dk(d)]){s++;d.setDate(d.getDate()-1)}$('#streak').textContent=`${s} 天`}function renderCal(){const y=view.getFullYear(),m=view.getMonth(),f=new Date(y,m,1),last=new Date(y,m+1,0);$('#month').textContent=`${y}年${m+1}月`;let h='';for(let i=0;i<f.getDay();i++)h+='<div class="day"></div>';for(let d=1;d<=last.getDate();d++){const k=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,r=records[k],mm=r&&mood(r.mood);h+=`<div class="day ${k===dk()?'today':''}">${d}${mm?`<span class="dot" style="--c:${mm.color}"></span>`:''}</div>`}$('#cal').innerHTML=h}function entries(){const now=new Date(),s=new Date();if(range==='week')s.setDate(now.getDate()-now.getDay());else if(range==='month')s.setDate(1);else s.setMonth(0,1);s.setHours(0,0,0,0);return Object.entries(records).filter(([k])=>new Date(k+'T00:00:00')>=s&&new Date(k+'T00:00:00')<=now)}function renderReport(){const rows=entries(),c={};rows.forEach(([,r])=>c[r.mood]=(c[r.mood]||0)+1);let top=null,h='';moods.filter(m=>c[m.id]).sort((a,b)=>c[b.id]-c[a.id]).forEach(m=>{top=top||m;const n=c[m.id],p=Math.round(n/rows.length*100);h+=`<div class="row"><b>${m.icon} ${m.name}</b><span>${n}天</span><div class="bar"><i style="width:${p}%;background:${m.color}"></i></div><span>${p}%</span></div>`});$('#report').innerHTML=h||'<p>这里还没有记录，今天可以开始放第一颗。</p>';$('#summary').textContent=top?`这段时间里「${top.name}」出现最多。每一种心情都被猫猫认真看见了。`:'投一颗心情后，这里会出现温柔总结。'}function render(){renderToday();renderJar();renderStats();renderCal();renderReport()}renderMoods();render();$$('.tabbar button').forEach(b=>b.onclick=()=>setView(b.dataset.v));$('#prev').onclick=()=>{view.setMonth(view.getMonth()-1);renderCal()};$('#next').onclick=()=>{view.setMonth(view.getMonth()+1);renderCal()};$$('.tabs button').forEach(b=>b.onclick=()=>{$$('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');range=b.dataset.r;renderReport()});$('#reset').onclick=()=>{delete records[dk()];save();render();toast('今天可以重新选择啦')};$('#demo').onclick=()=>{for(let i=0;i<28;i++){let d=new Date();d.setDate(d.getDate()-i);records[dk(d)]={mood:moods[(i*3)%moods.length].id,createdAt:d.toISOString()}}save();render();toast('演示数据已经放好')};</script></body></html>
